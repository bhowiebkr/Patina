[[note]]
id = "9a70000000000100"
pos = [0.0, -300.0]
width = 1000.0
text = "# SEEDED GUNS\nThe `gun` node makes a full gun from one seed. Change **seed**, **maker** or **rarity** to get a new gun. A **random** maker or rarity comes from the seed.\nClick **Run**, open **Views** and select **model-view**. Then click `look` to see the gun in 3D. The `report` nodes write the counts and the hash of each scene. The **gun-wall** view shows the guns of many seeds: click a gun to use its seed.\nThe lower row builds a gun from parts. Each part node has a seed and a maker, and the maker **none** removes the part.\nIn `export-gun`, click **Export** to write the gun to a `.glb` file and its stats to a `.txt` file in the **guns** folder."

