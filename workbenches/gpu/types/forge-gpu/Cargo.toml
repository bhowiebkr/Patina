[package]
name = "forge-gpu"
description = "wgpu helpers: hot-reloaded WGSL, checked shader compiles, textures"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/bhowiebkr/millwright-surface"
rust-version = "1.97"
publish = false

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "0.4"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = {version = "0.3", features = ["console"]}
futures-channel = "0.3"

[lints.rust]
unsafe_code = "deny"
