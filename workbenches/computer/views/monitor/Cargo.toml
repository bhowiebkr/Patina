[package]
name = "monitor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
patina-sdk = { workspace = true }
# A direct path, because cargo keeps the default features of a workspace dependency. The view
# compiles WGSL with `Gpu::shader`, so it does not need the `wesl` linker and its compile time.
patina-gpu = { path = "../../build/sdk/patina-gpu", default-features = false }
frame = { path = "../../types/frame" }
pad = { path = "../../types/pad" }
