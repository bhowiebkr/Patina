[package]
name = "laser-core"
description = "Beam finder, heat-drift settle estimate and measurement model for the laser level webcam. No I/O; builds for wasm."
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
repository = "https://github.com/bhowiebkr/laser-level-webcam"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "deny"
