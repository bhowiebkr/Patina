# Patina writes this workspace again when it builds the project.
[workspace]
resolver = "3"
members = ["nodes/*", "types/*", "widgets/*", "views/*"]
exclude = ["build/sdk/patina-sdk", "build/sdk/patina-macros", "build/sdk/patina-gpu"]

[workspace.dependencies]
patina-sdk = { path = "build/sdk/patina-sdk" }
patina-gpu = { path = "build/sdk/patina-gpu", default-features = false }

[patch.crates-io]
foldhash = { path = "build/sdk/patina-gpu/vendor/foldhash" }
