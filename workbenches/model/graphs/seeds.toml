[[note]]
id = "5eedd00000000001"
pos = [0.0, -260.0]
width = 760.0
text = "# 3 SEEDS\nThe `seed` node makes a sub-seed from its **name**. `random` gives a number in a range, and `pick` chooses one of two solids by **weights**.\nEach random value has its own name, so a new name changes only that value. The same seed gives the same house at each run.\nChange **seed** of the `seed` node to get a new house."

[[node]]
