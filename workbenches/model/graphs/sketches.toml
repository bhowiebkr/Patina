[[note]]
id = "5ce7c00000000001"
pos = [0.0, -260.0]
width = 760.0
text = "# 2 SKETCHES\nA sketch is a flat shape on the XY plane. `extrude` makes it thick along Z, with a **twist** in degrees and a **taper**: 0 keeps the top size and 1 makes a point.\n`revolve` turns the part of a sketch at x > 0 around the Y axis, which becomes Z. A **gap** in degrees leaves the turn open.\nA `polygon` is a text of points, for example `0 0, 2 0, 1 1.5`."

