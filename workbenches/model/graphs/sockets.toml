[[note]]
id = "50c4e00000000001"
pos = [0.0, -260.0]
width = 760.0
text = "# 4 SOCKETS AND EXPORT\nA socket is a named frame: a name, a position and three optional turns in degrees, for example `muzzle 1.5 0 0 0 90 0`.\n`attach` moves a solid to a socket, with the Z axis of the solid on the Z axis of the socket.\nIn `export`, click **File**, choose a `.glb`, `.obj` or `.stl` name and click **Export**. The `.glb` file keeps the sockets."

