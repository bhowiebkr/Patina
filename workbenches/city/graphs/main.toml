format = 1

[[note]]
id = "7e7e000000000001"
pos = [0.0, -340.0]
width = 1100.0
text = "# ORGANIC CITY\n`terrain` and `river` make the land. `density` puts the people on it. `highways`, `grow` and `prune` make the roads, which follow the hills.\n`blocks`, `lots`, `zoning` and `heights` make the lots. `buildings` plans a house, an apartment, a shop, a tower or a warehouse on each lot. `walls`, `facades` and `roofs` build it.\nChange **seed** in the `seed` node to get a new city. Click **Run**, open **Views** and select **model-view**. Then click `report` to see the full city.\nIn `export-buildings`, click **Export** to write one `.glb` file for each building into the **buildings** folder."

