[[note]]
id = "7e7e000000000001"
pos = [0.0, -340.0]
width = 1100.0
text = "# SEEDED CITY\nThe `streets` node makes a grid of streets from the seed. `blocks`, `lots` and `heights` make the lots, and `masses` and `facades` make the buildings.\n`scatter` puts model solids on the plots: trees on the parks and lamps on the sidewalks. Change **seed** in the `seed` node to get a new city.\nClick **Run**, open **Views** and select **model-view**. Then click `report` to see the full city.\nIn `export-buildings`, click **Export** to write one `.glb` file for each building into the **buildings** folder."

