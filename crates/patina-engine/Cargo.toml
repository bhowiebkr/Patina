[package]
name = "patina-engine"
version = "0.0.0"
description = "Checks, compiles and runs a Patina graph (spec 3). No UI code."
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.17.3"
flate2 = "1"
libloading = "0.8"
patina-sdk = { path = "../patina-sdk" }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
toml = "1"
