[package]
name = "patina-gpu"
version = "0.0.0"
description = "The shared GPU context, GPU types and the WESL linker of node code (spec 10)."
edition.workspace = true
publish.workspace = true
license.workspace = true
# The workbenches use this Rust version (spec 8.1).
rust-version = "1.100"

[lints]
workspace = true

[dependencies]
patina-sdk = { path = "../patina-sdk" }
# No GL and no WebGPU backends, as in the viewport (spec 15.8). Each backend adds compile time.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
# The WESL linker. A crate that compiles only WGSL can turn off the default features (10.1).
wesl = { version = "0.6", optional = true }

# FXC rejects dynamic array writes in material kernels. Static DXC keeps packages portable.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["static-dxc"] }

[features]
default = ["wesl"]
