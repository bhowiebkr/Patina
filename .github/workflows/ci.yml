# The checks of AGENTS.md. Run the same commands before each commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is the main platform. Linux and macOS are basic, so a failure there does not
    # fail the run (spec 13.5). Write an issue for it.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      # The system libraries of Tauri on Linux (spec 13.4).
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototypes/connections/frontend/package-lock.json
            prototypes/viewport/frontend/package-lock.json

      # The type check and the build of the web frontends of the prototypes.
      - name: Frontend of the connections prototype
        working-directory: prototypes/connections/frontend
        run: |
          npm ci
          npm run build

      - name: Frontend of the viewport prototype
        working-directory: prototypes/viewport/frontend
        run: |
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
