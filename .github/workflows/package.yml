# Makes the portable zip of Windows and Linux with `cargo run -p package` (spec 13.1).
# Start it by hand, or push a tag `v*`. The zip is an artifact of the run.
# A tag `v<version>` also makes a GitHub Release with the zips and the notes of CHANGELOG.md.
name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  zip:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      # The system libraries of Tauri on Linux (spec 13.4).
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev libasound2-dev zip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/patina-editor/frontend/package-lock.json

      - name: Install the npm packages
        working-directory: crates/patina-editor/frontend
        run: npm ci

      - name: Make the zip
        run: cargo run -p package --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patina-${{ runner.os }}
          path: target/package/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: zip
    # A failed Linux zip leaves out the Linux file (spec 13.5). The Windows zip must be there.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$version\"" crates/patina-editor/tauri.conf.json \
            || { echo "The tag $GITHUB_REF_NAME is not the version in tauri.conf.json."; exit 1; }
          ls zips/*windows*.zip
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version."; exit 1; }
          gh release create "$GITHUB_REF_NAME" zips/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "Patina $version" --notes-file notes.md
