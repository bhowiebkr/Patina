[workspace]
resolver = "3"
members = [
    "prototypes/connections",
    "prototypes/viewport",
    "prototypes/hot-reload",
    "prototypes/types-across-clusters",
    "prototypes/toolchain",
    "tools/repo-checks",
]
# The user projects of the prototypes build alone, with their own flags and toolchains.
exclude = ["prototypes/types-across-clusters/project", "prototypes/toolchain/fixture"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Each member crate sets `[lints] workspace = true` (AGENTS.md, Rust code).
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
