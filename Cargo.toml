[workspace]
resolver = "3"
members = [
    "crates/patina-capi",
    "crates/patina-cli",
    "crates/patina-editor",
    "crates/patina-engine",
    "crates/patina-gpu",
    "crates/patina-macros",
    "crates/patina-sdk",
    "prototypes/connections",
    "prototypes/viewport",
    "prototypes/hot-reload",
    "prototypes/types-across-clusters",
    "prototypes/toolchain",
    "tools/package",
    "tools/repo-checks",
]
# The user projects of the prototypes build alone, with their own flags and toolchains.
exclude = [
    "examples",
    "prototypes/types-across-clusters/project",
    "prototypes/toolchain/fixture",
]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Each member crate sets `[lints] workspace = true` (AGENTS.md, Rust code).
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
