[package]
name = "forge-runtime"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/bhowiebkr/millwright-surface"
publish = false

[dependencies]
forge-core = { path = "../forge-core" }
forge-gpu = { path = "../forge-gpu" }
forge-nodes = { path = "../forge-nodes" }
forge-render = { path = "../forge-render" }
forge-sources = { path = "../forge-sources" }
forge-png = { path = "../forge-png" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.30", features = ["bytemuck"] }
png = "0.18"
flate2 = "1.1"

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
