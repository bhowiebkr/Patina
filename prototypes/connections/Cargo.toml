[package]
name = "connections"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Milestone 0 prototype: live wires and buses in a Tauri graph view (spec 15.9)."

[dependencies]
# No "compression": the frontend is not embedded, so brotli only adds compile time.
tauri = { version = "2.12", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The bench screenshots use the DevTools protocol of WebView2 (src/shot.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
base64 = "0.23"

[build-dependencies]
tauri-build = "2.7"

[lints]
workspace = true
